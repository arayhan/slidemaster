name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Lets a run be triggered by hand — needed to answer 0-gate-deploy question 5
  # when pushes are not scheduling runs.
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Same four checks as /verify, in the same order. CI that runs fewer than
      # the local loop is CI that passes things the local loop would have caught.
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
